<ion-content [fullscreen]="true" class="signin-content">

  <!-- TOP HEADER NAV -->
  <div class="header-nav-container">
    <ion-icon
      name="arrow-back"
      class="back-icon"
      (click)="back()">
    </ion-icon>
    <h2 class="header-title">Login</h2>
    <div class="header-spacer"></div>
  </div>

  <!-- FORM SECTION -->
  <div class="form-section">

    <!-- Mobile Number Field -->
    <!-- <label>Mobile Number</label>
    <div class="input-box">
      <ion-icon name="mail-outline" class="input-icon"></ion-icon>
      <ion-input
        type="tel"
        [(ngModel)]="mobileNumber"
        placeholder="9876543210">
      </ion-input>
    </div> -->

    <!-- Email Address Field -->
    <label class="mt-20">Email Address</label>
    <div class="input-box">
      <ion-input
        type="email"
        [(ngModel)]="email"
        placeholder="Example@gmail.com">
      </ion-input>
    </div>

    <!-- Name Field -->
    <label class="mt-20">Name</label>
    <div class="input-box">
      <ion-input
        type="text"
        [(ngModel)]="name"
        placeholder="Enter Name">
      </ion-input>
    </div>

    <!-- Terms & Conditions Container -->
    <div class="terms-checkbox-container">
      <ion-checkbox [(ngModel)]="acceptedTerms" mode="md" class="custom-checkbox"></ion-checkbox>
      <span class="terms-text">
        I accept the <span class="highlight" (click)="openTerms()">terms & conditions</span>
      </span>
    </div>

    <!-- Next Action Button -->
    <ion-button
      expand="block"
      class="signin-btn"
      (click)="nextStep()">
      Next
    </ion-button>

  </div>

</ion-content>
