
<div class="mobile-container">

  <!-- HEADER -->
  <header class="main-header">
    <button class="back-btn" type="button" (click)="goBack()">
      <svg width="22" height="22" viewBox="0 0 24 24"
           fill="none" stroke="#00D995" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M12 19L5 12L12 5"></path>
      </svg>
    </button>

    <h1 class="header-title">Client</h1>

    <div class="header-spacer"></div>
  </header>

  <!-- CLIENT LIST -->
  <main class="scrollable-content">

    <div
      class="client-card"
      *ngFor="let client of filteredClients"
      (click)="viewClientProfile(client)"
    >

      <!-- PROFILE IMAGE -->
      <div class="avatar-container">
        <img [src]="client.avatar" [alt]="client.name" />
      </div>

      <!-- CLIENT DETAILS -->
      <div class="client-info">

        <h3>{{ client.name }}</h3>

        <!-- DATE INFORMATION -->
        <div class="info-grid">

          <div class="info-item">
            <svg class="card-icon" viewBox="0 0 24 24"
                 fill="none" stroke="#00D995"
                 stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <path d="M16 3V7"></path>
              <path d="M8 3V7"></path>
              <path d="M3 10H21"></path>
              <path d="M8 14H10"></path>
              <path d="M14 14H16"></path>
            </svg>

            <span>{{ client.startDate }}</span>
          </div>

          <div class="info-item">
            <svg class="card-icon" viewBox="0 0 24 24"
                 fill="none" stroke="#00D995"
                 stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <path d="M16 3V7"></path>
              <path d="M8 3V7"></path>
              <path d="M3 10H21"></path>
              <path d="M8 14H10"></path>
              <path d="M14 14H16"></path>
            </svg>

            <span>{{ client.endDate }}</span>
          </div>

          <!-- DURATION -->
          <div class="info-item">
            <svg class="card-icon filled-icon" viewBox="0 0 24 24"
                 fill="#00D995">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10
                       10-4.48 10-10S17.52 2 12 2zm1 11h5v-2h-4V6h-2v6
                       c0 .55.45 1 1 1z"/>
            </svg>

            <span>{{ client.duration }}</span>
          </div>

          <!-- PAYMENT -->
          <div class="info-item">
            <svg class="card-icon filled-icon" viewBox="0 0 24 24"
                 fill="#00D995">
              <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2
                       2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z
                       M20 18H4v-7h16v7zm0-11H4V6h16v1zm-13
                       7h4v2H7v-2z"/>
            </svg>

            <span>₹{{ client.amount | number }}</span>
          </div>

        </div>
      </div>

      <!-- RIGHT ARROW -->
      <div class="card-arrow">
        <svg width="19" height="19" viewBox="0 0 24 24"
             fill="none" stroke="#888888" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18L15 12L9 6"></path>
        </svg>
      </div>

    </div>

    <!-- EMPTY STATE -->
    <div class="empty-state" *ngIf="filteredClients.length === 0">
      No clients found
    </div>

  </main>

  <!-- BOTTOM ADD CLIENT BUTTON -->
  <footer class="bottom-action">

    <button class="add-client-btn" type="button">
      <span>+</span> Add Client
    </button>

  </footer>

</div>
