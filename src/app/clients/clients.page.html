<div class="mobile-container">

  <!-- MAIN HEADER WITH DEVICE SAFE BOUNDARIES -->
  <header class="main-header">
    <img src="assets/images/menu.png" alt="Menu" class="feature-icon-img" />
    <h1 class="header-title">Diet Plan</h1>
    <div class="header-spacer"></div>
  </header>

  <!-- SEARCH CONTROLLER -->
  <div class="search-container">
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search" [(ngModel)]="searchQuery" (input)="filterClients()" />
    </div>
  </div>

  <!-- FILTER CONTROLS BAR -->
  <div class="filter-tabs-row">
    <div class="tabs-group">
      <button class="tab-btn" [class.active]="activeTab === 'prospects'" (click)="setTab('prospects')">
        Prospects <span class="badge badge-prospect">{{ getCount('prospects') }}</span>
      </button>
      <button class="tab-btn" [class.active]="activeTab === 'clients'" (click)="setTab('clients')">
        Clients <span class="badge badge-client">{{ getCount('clients') }}</span>
      </button>
      <button class="tab-btn" [class.active]="activeTab === 'ex-clients'" (click)="setTab('ex-clients')">
        Ex-Clients <span class="badge badge-ex">{{ getCount('ex-clients') }}</span>
      </button>
    </div>
    
    <button class="filter-action-btn">
      <span>Filter</span>
      <svg class="filter-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 4a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2.5a1 1 0 0 1-.293.707L15 13.414V19a1 1 0 0 1-.447.894l-4 2A1 1 0 0 1 9 21v-7.586L3.293 7.207A1 1 0 0 1 3 6.5V4z"/>
      </svg>
    </button>
  </div>

  <!-- SCROLLABLE LIST CONTAINER -->
  <main class="scrollable-content">
    <div class="client-card clickable-card" *ngFor="let client of filteredClients" (click)="viewClientProfile(client)">
      <div class="avatar-container">
        <img [src]="client.avatar" [alt]="client.name" />
      </div>
      <div class="client-info">
        <h3>{{ client.name }}</h3>
        
        <div class="info-grid">
          <!-- PHONE & GENDER SIDE BY SIDE -->
          <div class="info-row">
            <div class="info-item">
              <img src="assets/images/call.png" alt="Phone" class="card-icon" />
              <span class="info-text">{{ client.phone }}</span>
            </div>
            
            <div class="info-item">
              <img src="assets/images/gender.png" alt="Gender" class="card-icon" />
              <span class="info-text">{{ client.gender }}</span>
            </div>
          </div>

          <!-- EMAIL FULL ROW -->
          <div class="info-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#00d689" class="card-icon">
              <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            <span class="info-text muted-email">{{ client.email }}</span>
          </div>
        </div>
      </div>
    </div>
  </main>

</div>
