<ion-content [fullscreen]="true" class="workout-content">

  <div class="workout-main-wrapper">
    <header class="workout-header">
      <img src="assets/images/menu.png" alt="Swap Task" class="feature-icon-img" />
      <h1 class="page-title">Workout Plans</h1>
    </header>

    <div class="search-container">
      <div class="search-input-box">
        <ion-icon name="search-outline" class="search-icon" aria-hidden="true"></ion-icon>
        <input 
          type="text" 
          [(ngModel)]="searchQuery" 
          (input)="filterPlans()" 
          placeholder="Search" 
          class="custom-search-field" />
      </div>
    </div>

    <div class="filter-toggle-row">
      <span class="toggle-label">My Plans</span>
      <ion-toggle
        id="my-plans-toggle"
        [(ngModel)]="myPlansOnly"
        mode="ios"
        class="custom-toggle"
        (ionChange)="filterPlans()">
      </ion-toggle>
    </div>

    <main class="plans-list">
      <article
        class="plan-card"
        *ngFor="let plan of filteredPlans; let i = index"
        (click)="viewPlanDetails(plan)">

        <div class="card-top-row">
          <div class="title-heading-group">
            <h2 class="plan-name">{{ plan.name }}</h2>
            <span class="system-badge" *ngIf="plan.isSystemPlan">System</span>
          </div>

          <div class="action-icons">
            <button 
              type="button"
              class="icon-action-btn"
              *ngIf="plan.isCopyable"
              (click)="copyPlan(plan, $event)"
              aria-label="Duplicate plan">
                <img src="assets/images/copy.png" alt="Swap Task" style="width:19px !important; height: 19px !important; display: block; object-fit: contain; background: #fff;"/>
            </button>

            <button 
              type="button"
              class="icon-action-btn"
              (click)="editPlan(plan, $event)"
              aria-label="Edit plan">
                <img src="assets/images/edit.png" alt="Swap Task" style="width:19px !important; height: 19px !important; display: block; object-fit: contain; background: #fff;"/>
            </button>
          </div>
        </div>

        <p class="plan-description" *ngIf="expandedIndex === i">
          {{ plan.description }}
        </p>

        <div class="card-bottom-row">
          <div class="badge-scroll-wrapper">
            <span class="tag-badge primary-badge" *ngFor="let tag of plan.tags">
              {{ tag }}
            </span>
          </div>

          <div class="expand-chevron-btn" (click)="toggleExpand(i); $event.stopPropagation()">
            <ion-icon
              [name]="expandedIndex === i ? 'chevron-down-outline' : 'chevron-forward-outline'"
              class="arrow-indicator">
            </ion-icon>
          </div>
        </div>

      </article>

      <div class="empty-state" *ngIf="filteredPlans.length === 0">
        <ion-icon name="barbell-outline" class="empty-icon"></ion-icon>
        <p>No workout plans found.</p>
      </div>
    </main>
  </div>

</ion-content>

<div class="bottom-action-container">
  <ion-button
    expand="block"
    class="create-btn"
    (click)="openAddWorkoutModal()">
    + Create New
  </ion-button>
</div>
