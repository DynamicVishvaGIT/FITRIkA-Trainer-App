<div class="app-container package-view">
  <header class="app-header">
    <div class="header-row">
      <button class="back-btn" (click)="goBack()" type="button">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#00c48c"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>

      <h1 class="header-title">Package</h1>

      <button
        class="add-btn-circle"
        (click)="navigateToAddPackage()"
        type="button"
      >
        <span class="plus-icon">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#ffffff"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </span>
        <span class="add-text">Add</span>
      </button>
    </div>
  </header>

  <main class="content-scroll">
    <div
      *ngFor="let pkg of packages"
      class="package-card"
      [class.active]="selectedPackageId === pkg.id"
      [class.expanded]="pkg.isExpanded"
      [class.is-expanded]="pkg.isExpanded"
      [class.is-collapsed]="!pkg.isExpanded"
    >
      <div class="accent-strip" *ngIf="selectedPackageId === pkg.id"></div>

      <div class="card-header" (click)="handleCardSelect(pkg)">
        <div class="header-left">
          <div
            class="custom-radio"
            [class.checked]="selectedPackageId === pkg.id"
          >
            <div
              class="radio-inner"
              *ngIf="selectedPackageId === pkg.id"
            ></div>
          </div>

          <span class="package-name" [title]="pkg.name">
            {{ pkg.name }}
          </span>

          <!-- EDIT BUTTON (Left: Appears when card is CLOSED/COLLAPSED) -->
          <button
            class="edit-icon-btn edit-btn-left"
            (click)="navigateToEditPackage($event, pkg.id)"
            type="button"
          >
            <img src="assets/images/pack.png" alt="Edit" />
          </button>
        </div>

        <div class="header-right">
          <!-- EDIT BUTTON (Right: Appears next to price when card is OPEN/EXPANDED) -->
          <button
            class="edit-icon-btn edit-btn-right"
            (click)="navigateToEditPackage($event, pkg.id)"
            type="button"
          >
            <img src="assets/images/pack.png" alt="Edit" />
          </button>

          <div class="price-container">
            <span class="price-amount">₹{{ pkg.price | number }}</span>
            <span class="price-period">per month</span>
          </div>

          <div class="chevron-indicator">
            <svg
              *ngIf="!pkg.isExpanded"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#94a3b8"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>

            <svg
              *ngIf="pkg.isExpanded"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#94a3b8"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </div>

      <div class="card-details" *ngIf="pkg.isExpanded">
        <div class="details-divider"></div>

        <ul class="inclusions-list">
          <li *ngFor="let item of pkg.inclusions">
            <span class="check-dot">
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#00c48c"
                stroke-width="3.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>

            <span class="inclusion-text" [title]="item">
              {{ item }}
            </span>
          </li>
        </ul>
      </div>
    </div>
  </main>

  <footer class="sticky-footer">
    <button
      class="primary-select-btn"
      (click)="confirmSelection()"
      type="button"
    >
      Select
    </button>
  </footer>
</div>
