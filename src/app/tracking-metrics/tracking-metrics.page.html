<div class="mobile-container">
  <!-- HEADER -->
  <header class="main-header">
    <button class="back-btn" (click)="goBack()" aria-label="Go Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00cb82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <h1 class="header-title">Progress Tracking Metrics</h1>
    <div class="header-spacer"></div>
  </header>

  <!-- SCROLLABLE CONTENT -->
  <main class="scrollable-content">

    <!-- SUCCESS TOAST NOTIFICATION -->
    <div class="success-toast" *ngIf="showSuccessMessage">
      <span>✓ Metrics submitted successfully!</span>
    </div>

    <!-- CHART CARD SECTION -->
    <section class="chart-card">
      <span class="chart-label">TRACKING METRICS</span>

      <div class="chart-legend" *ngIf="activeVariables.length > 0">
        <span class="legend-line-indicator"></span>
        <span class="legend-text">LINE</span>
      </div>

      <!-- CHART WRAPPER WITH SVG AXES + STATIC IMAGE GRAPH -->
      <div class="chart-wrapper">
        <svg class="chart-svg" viewBox="0 0 320 200" preserveAspectRatio="none">
          <!-- Y-Axis Labels -->
          <g class="y-labels">
            <text *ngFor="let yVal of [100, 90, 80, 70, 60, 50, 40, 30, 20, 10]"
                  x="26" [attr.y]="getGridY(yVal) + 3" text-anchor="end" class="axis-text">
              {{ yVal }}
            </text>
          </g>

          <!-- Main Axis Lines -->
          <line x1="35" y1="170" x2="310" y2="170" stroke="#cbd5e1" stroke-width="1.5" />
          <line x1="35" y1="10" x2="35" y2="170" stroke="#cbd5e1" stroke-width="1.5" />

          <!-- Y-Axis Ticks -->
          <g class="y-ticks">
            <line *ngFor="let yVal of [100, 90, 80, 70, 60, 50, 40, 30, 20, 10]"
                  x1="31" [attr.y1]="getGridY(yVal)" x2="35" [attr.y2]="getGridY(yVal)"
                  stroke="#cbd5e1" stroke-width="1.5" />
          </g>

          <!-- X-Axis Ticks -->
          <g class="x-ticks">
            <line *ngFor="let m of months; let i = index"
                  [attr.x1]="getXPos(i)" y1="170" [attr.x2]="getXPos(i)" y2="175"
                  stroke="#cbd5e1" stroke-width="1.5" />
          </g>

          <!-- X-Axis Labels -->
          <g class="x-labels">
            <text *ngFor="let m of months; let i = index"
                  [attr.x]="getXPos(i)" y="188" text-anchor="middle" class="axis-text">
              {{ m }}
            </text>
          </g>
        </svg>

        <!-- STATIC GRAPH IMAGE OVERLAY -->
        <img *ngIf="activeVariables.length > 0" 
             src="assets/images/progress-line-graph.png" 
             alt="Progress Line Graph" 
             class="chart-img-overlay" />

        <!-- EMPTY STATE TEXT -->
        <div class="empty-chart-msg" *ngIf="activeVariables.length === 0">
          <span>Select metric variables below to plot data</span>
        </div>

        <!-- ADD VARIABLE BUTTON ON CHART -->
        <button class="chart-add-btn" (click)="openBottomSheet()" aria-label="Add Variable">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00cb82" stroke-width="3">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </section>

    <!-- ACTIVE SELECTED TAGS ROW -->
    <section class="selected-chips-row" [class.has-active-chips]="activeVariables.length > 0">
      <ng-container *ngIf="activeVariables.length > 0; else emptyPlaceholder">
        <div class="active-chip" *ngFor="let varItem of activeVariables">
          <span class="check-icon">✓</span>
          <span class="chip-text">{{ varItem.name }}</span>
          <button class="remove-chip-btn" (click)="removeSingleVariable(varItem)" aria-label="Remove Tag">×</button>
        </div>

        <button class="delete-icon-btn" (click)="clearActiveVariables()" aria-label="Clear All Selected">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </ng-container>
      <ng-template #emptyPlaceholder>
        <div class="placeholder-spacer"></div>
      </ng-template>
    </section>

    <!-- BASIC / ADVANCED TABS -->
    <div class="tab-container">
      <button class="tab-btn" [class.active]="selectedTab === 'basic'" (click)="selectedTab = 'basic'">Basic</button>
      <button class="tab-btn" [class.active]="selectedTab === 'advanced'" (click)="selectedTab = 'advanced'">Advanced</button>
    </div>

    <!-- INDEPENDENT CATEGORIES & CHIPS -->
    <section class="category-group" *ngFor="let cat of activeCategories">
      <h3 class="category-title">{{ cat.title }}</h3>
      <div class="chips-container">
        <button *ngFor="let item of cat.items"
                class="chip-button"
                [class.selected]="item.selected"
                (click)="toggleVariable(item)">
          <span class="chip-check" *ngIf="item.selected">✓</span>
          <span class="chip-label">{{ item.name }}</span>
        </button>

        <button class="add-chip-btn" (click)="openBottomSheet(cat)" aria-label="Add Variable to Category">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </section>

    <!-- SUBMIT BUTTON -->
    <div class="submit-wrapper">
      <button class="submit-btn" (click)="submitMetrics()">Submit</button>
    </div>

  </main>
</div>

<!-- BOTTOM SHEET MODAL -->
<div class="bottom-sheet-backdrop" *ngIf="showBottomSheet" (click)="closeBottomSheet()">
  <div class="sheet-container" (click)="$event.stopPropagation()">

    <div class="sheet-header">
      <h2 class="sheet-title">Add Metric Variable</h2>
      <button class="close-icon-btn" (click)="closeBottomSheet()" aria-label="Close Modal">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </button>
    </div>

    <div class="sheet-body">
      <div class="field-group">
        <label class="field-label">Variable Name</label>
        <div class="input-card">
          <input type="text" [(ngModel)]="newMetric.name" placeholder="e.g. Bicep Curl, Water Intake" class="light-input">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Select Tag / Category</label>
        <div class="input-card select-card" (click)="toggleDropdown()">
          <span class="select-placeholder" [class.has-value]="newMetric.categoryTitle">
            {{ newMetric.categoryTitle || 'Select Tag' }}
          </span>
          <svg class="arrow-icon" [class.open]="isDropdownOpen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5">
            <polyline points="18 15 12 9 6 15"></polyline>
          </svg>
        </div>

        <div class="dropdown-list" *ngIf="isDropdownOpen">
          <div class="dropdown-item" *ngFor="let cat of activeCategories" [class.active]="cat.title === newMetric.categoryTitle" (click)="selectCategory(cat.title)">
            <span>{{ cat.title }}</span>
            <span class="check" *ngIf="cat.title === newMetric.categoryTitle">✓</span>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Initial Score/Value (0-100)</label>
        <div class="input-card">
          <input type="number" min="0" max="100" [(ngModel)]="newMetric.initialScore" placeholder="Enter starting value (e.g. 50)" class="light-input">
        </div>
      </div>

      <div class="modal-actions">
        <button class="cancel-btn" (click)="closeBottomSheet()">Cancel</button>
        <button class="action-submit-btn" [disabled]="!newMetric.name || !newMetric.name.trim()" (click)="saveNewMetric()">
          Add Variable
        </button>
      </div>
    </div>
  </div>
</div>
