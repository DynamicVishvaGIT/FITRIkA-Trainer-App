<ion-content
  class="edit-content"
  [scrollY]="true"
  (click)="closeDropdown()">

  <div class="edit-modal-wrapper">

    <!-- HEADER -->
    <div class="modal-header">

      <h2>Edit</h2>

      <button
        type="button"
        class="close-btn"
        (click)="dismiss()">

        <ion-icon name="close-circle-outline"></ion-icon>

      </button>

    </div>


    <!-- FORM -->
    <div class="modal-body">

      <label class="input-label">
        Change
      </label>


      <!-- DROPDOWN -->
      <div
        class="custom-dropdown"
        (click)="$event.stopPropagation()">

        <!-- SELECTED VALUE -->
        <button
          type="button"
          class="select-header"
          [class.open]="isDropdownOpen"
          (click)="toggleDropdown()">

          <span class="selected-text">
            {{ selectedStatusLabel }}
          </span>

          <ion-icon
            [name]="isDropdownOpen
              ? 'chevron-up-outline'
              : 'chevron-down-outline'">
          </ion-icon>

        </button>


        <!-- OPTIONS -->
        <div
          *ngIf="isDropdownOpen"
          class="dropdown-menu">

          <button
            *ngFor="let option of statusOptions"
            type="button"
            class="option"
            [class.selected]="selectedStatus === option.value"
            (click)="selectOption(option)">

            <span>
              {{ option.label }}
            </span>

            <ion-icon
              *ngIf="selectedStatus === option.value"
              name="checkmark-outline">
            </ion-icon>

          </button>

        </div>

      </div>


      <!-- SUBMIT -->
      <button
        type="button"
        class="submit-btn"
        (click)="submitChange()">

        Submit

      </button>

    </div>

  </div>

</ion-content>
