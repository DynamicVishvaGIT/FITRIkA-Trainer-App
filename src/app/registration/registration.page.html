<ion-content [fullscreen]="true" class="registration-content">
  <div class="registration-scroll-container">

    <!-- Top Dark Header Section -->
    <header class="top-brand-section">
      <div class="header-nav">
        <ion-icon name="arrow-back" class="back-icon" (click)="back()"></ion-icon>
      </div>

      <div class="logo-container">
        <img src="assets/images/hyyndlogo.png" class="logo" alt="Logo">
        <h1>Welcome back</h1>
        <p>Log in to your account and continue your fitness journey.</p>
      </div>
    </header>

    <!-- Form & Actions Section -->
    <main class="form-section">

      <!-- Mobile Input -->
      <div class="input-group">
        <label for="mobile-input">Mobile Number</label>
        <div class="input-box">
          <ion-icon name="call" class="input-icon"></ion-icon>
          <ion-input
            id="mobile-input"
            type="tel"
            inputmode="tel"
            [(ngModel)]="mobile"
            placeholder="Enter the phone number">
          </ion-input>
        </div>
      </div>

      <!-- Email Input -->
      <div class="input-group">
        <label for="email-input">Email Address</label>
        <div class="input-box">
          <ion-icon name="mail" class="input-icon"></ion-icon>
          <ion-input
            id="email-input"
            type="email"
            inputmode="email"
            [(ngModel)]="emailAddress"
            placeholder="Example@gmail.com">
          </ion-input>
        </div>
      </div>

      <!-- Name Input -->
      <div class="input-group">
        <label for="name-input">Name</label>
        <div class="input-box">
          <ion-icon name="person" class="input-icon"></ion-icon>
          <ion-input
            id="name-input"
            type="text"
            [(ngModel)]="name"
            placeholder="Enter Name">
          </ion-input>
        </div>
      </div>

      <!-- Terms Checkbox Block -->
      <div class="terms-container">
        <ion-checkbox [(ngModel)]="termsAccepted" mode="md" class="custom-checkbox"></ion-checkbox>
        <span class="terms-text">I accept the <a href="#" (click)="$event.preventDefault()">terms & conditions</a></span>
      </div>

      <!-- Action Button -->
      <ion-button
        expand="block"
        class="continue-btn"
        (click)="continue()">
        Next
      </ion-button>

    </main>

  </div>
</ion-content>
